name: Build Vibe Monitor

# PyInstaller can't cross-compile, so each OS builds its own bundle on its
# own runner. Produces a zipped onedir the user extracts and double-clicks -
# no Python environment needed on the target machine. Artifacts are attached
# to the run; pushing a tag also publishes them to a GitHub Release.
# Runs on pushes to master (each merge) and release tags. On a PR, add the "build app" label
# (remove and add it again to rebuild); on any branch, start it with Actions > Build Vibe Monitor >
# Run workflow, or gh workflow run build-vibe-monitor.yml --ref <branch>.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths:
      - 'monitor_app/**'
      - '!monitor_app/**/*.md'
      - '.github/workflows/build-vibe-monitor.yml'
  pull_request:
    types: [labeled]
    paths:
      - 'monitor_app/**'
      - '!monitor_app/**/*.md'
      - '.github/workflows/build-vibe-monitor.yml'
  workflow_dispatch:

concurrency:
  # Other PR labels also start this workflow, with the jobs skipped; they must not cancel a build.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File packaging/build.ps1 -Name MOKUKU-Vibe-Monitor-windows
            artifact: MOKUKU-Vibe-Monitor-windows
          - os: ubuntu-24.04
            script: bash packaging/build.sh MOKUKU-Vibe-Monitor-linux-ubuntu24.04
            artifact: MOKUKU-Vibe-Monitor-linux-ubuntu24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: monitor_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundle
        run: ${{ matrix.script }}

      # Upload the onedir folder, not the .zip the build script also makes -
      # upload-artifact always zips its input, so handing it a .zip produces a
      # zip-inside-a-zip. Uploading the folder yields a single zip named
      # <artifact>.zip whose contents are the app itself.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "monitor_app/dist/MOKUKU Vibe Monitor"
          if-no-files-found: error

      # The release asset is the build script's own zip (wrapped in a
      # "MOKUKU Vibe Monitor" folder), attached only on tags.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: monitor_app/dist/*.zip
