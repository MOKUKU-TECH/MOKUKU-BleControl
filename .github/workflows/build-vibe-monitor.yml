name: Build Vibe Monitor

# PyInstaller can't cross-compile, so each OS builds its own bundle on its
# own runner. Produces a zipped onedir the user extracts and double-clicks -
# no Python environment needed on the target machine. Artifacts are attached
# to the run; pushing a tag also publishes them to a GitHub Release.
on:
  push:
    branches: [master, main, compress_app]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File packaging/build.ps1 -Name MOKUKU-Vibe-Monitor-windows
            artifact: MOKUKU-Vibe-Monitor-windows
          # Two Linux builds: PyInstaller bundles libpython but not glibc, so
          # a bundle requires >= the build machine's glibc. The 22.04 build
          # (glibc 2.35) runs on older systems; the 24.04 build (glibc 2.39)
          # is for matching-or-newer ones. Distinct zip names so they don't
          # collide on a release.
          - os: ubuntu-22.04
            script: bash packaging/build.sh MOKUKU-Vibe-Monitor-linux-ubuntu22.04
            artifact: MOKUKU-Vibe-Monitor-linux-ubuntu22.04
          - os: ubuntu-24.04
            script: bash packaging/build.sh MOKUKU-Vibe-Monitor-linux-ubuntu24.04
            artifact: MOKUKU-Vibe-Monitor-linux-ubuntu24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: monitor_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundle
        run: ${{ matrix.script }}

      # Upload the onedir folder, not the .zip the build script also makes -
      # upload-artifact always zips its input, so handing it a .zip produces a
      # zip-inside-a-zip. Uploading the folder yields a single zip named
      # <artifact>.zip whose contents are the app itself.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "monitor_app/dist/MOKUKU Vibe Monitor"
          if-no-files-found: error

      # The release asset is the build script's own zip (wrapped in a
      # "MOKUKU Vibe Monitor" folder), attached only on tags.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: monitor_app/dist/*.zip

  # Ubuntu 20.04 (glibc 2.31) for the oldest targets. GitHub retired the
  # hosted ubuntu-20.04 runner, so build inside an ubuntu:20.04 container on a
  # current runner instead - the container's system Python 3.8 is linked
  # against glibc 2.31, which is what makes the bundle run on 20.04-era
  # systems. (setup-python's prebuilt interpreters are built against a newer
  # glibc, so they wouldn't help here - hence the system python3.)
  build-linux-legacy:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      # git for checkout; python3/pip/zip for the build; the libgl/xcb/dbus
      # libs so PyInstaller can import PyQt5 during analysis on this headless,
      # minimal image (the hosted runners already ship them).
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 python3-pip zip ca-certificates \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - uses: actions/checkout@v4

      - name: Build bundle
        working-directory: monitor_app
        run: bash packaging/build.sh MOKUKU-Vibe-Monitor-linux-ubuntu20.04

      - uses: actions/upload-artifact@v4
        with:
          name: MOKUKU-Vibe-Monitor-linux-ubuntu20.04
          path: "monitor_app/dist/MOKUKU Vibe Monitor"
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: monitor_app/dist/*.zip
